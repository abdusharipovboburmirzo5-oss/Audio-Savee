services:
  - type: worker
    name: instagram-downloader-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: DOWNLOAD_DIR
        value: downloads
      - key: PORT
        value: 8080
    disk:
      name: downloads-data
      mountPath: /app/downloads
      sizeGB: 1
